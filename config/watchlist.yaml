# selectable entry in the app's sidebar. `default_watchlist` picks which one
# a fresh session starts on. This file only seeds a *new* session/device;
# once running, edits happen in the app itself (Edit mode, or the paste-
# import box) and are session/Gist-scoped, not written back here.
# ---------------------------------------------------------------------------

